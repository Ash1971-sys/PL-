<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 30 196 196">
  <view id="full" viewBox="0 30 456 202"/>
  <style>
    .brand-image { clip-path: url(#lion-bounds); }
    #full:target ~ .brand-image { clip-path: none; }
  </style>
  <defs>
    <clipPath id="lion-bounds"><rect x="-22" y="30" width="196" height="196"/></clipPath>
    <!-- The attached wordmark has an opaque grey checkerboard. Mask its neutral background at display time. -->
    <filter id="wordmark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix values="0 0 0 0 .2392
                              0 0 0 0 .0980
                              0 0 0 0 .3569
                              0 -1.244 0 0 1.122"/>
    </filter>
  </defs>
  <rect x="-22" y="30" width="196" height="196" rx="18" fill="#fff"/>
  <image class="brand-image" width="464" height="247" href="data:image/avif;base64," filter="url(#wordmark)"/>
</svg>
